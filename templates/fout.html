<!doctype html>
<!-- Foutpagina in DVZ-huisstijl (huisstijl-idee 28, 26 okt 2026). Gemaakt voor de OV-monitor (app/server.py errorhandler);
     vervangt de standaardpagina van Hestia. Logo via dvz-logo.js (label reader); donker volgt cookie dvz_thema of het systeem. -->
<html lang="nl" data-dvz-label="ovreader">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{ titel }} · OV-monitor</title>
<link rel="icon" href="https://reader.dvznet.nl/favicon.ico" sizes="any">
<script>
  (function () { var c = (document.cookie.match(/(?:^|;\s*)dvz_thema=(donker|licht)/) || [])[1];
    if (c ? c === 'donker' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); })();
</script>
<style>
  :root { --bg: #f1f5f9; --kaart: #fff; --tekst: #0f172a; --zacht: #64748b; --rand: #e2e8f0; --kop: #1e293b; --link: #2563eb; }
  html.dark { --bg: #0b1120; --kaart: #111827; --tekst: #e5e7eb; --zacht: #94a3b8; --rand: #1f2937; --kop: #0f172a; --link: #60a5fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 15px/1.55 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { background: var(--kop); color: #fff; padding: calc(7px + env(safe-area-inset-top)) 16px 7px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--link); }
  .wordmark { width: 32px; height: 32px; border-radius: 22%; background: #1e293b; border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center;
    font: 800 12px 'Inter', system-ui, sans-serif; letter-spacing: .02em; color: #fff; text-decoration: none; flex: none; }
  header b { font-size: 15px; }
  main { max-width: 560px; margin: 12vh auto 0; padding: 0 16px; }
  .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 12px; padding: 28px 24px; }
  .code { font: 800 13px 'Inter', system-ui, sans-serif; letter-spacing: .08em; color: var(--zacht); }
  h1 { margin: 6px 0 8px; font-size: 24px; line-height: 1.25; text-wrap: balance; }
  p { margin: 0 0 20px; color: var(--zacht); }
  .knoppen { display: flex; gap: 8px; flex-wrap: wrap; }
  .knop { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; }
  .knop.primair { background: var(--link); color: #fff; border: 0; }
  .knop.stil { background: transparent; color: var(--tekst); border: 1px solid var(--rand); font: 600 14px 'Inter', system-ui, sans-serif; }
  .knop:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
</style>
<script src="/dvz-logo.js?v=1" defer></script>
</head>
<body>
<header><a class="wordmark" href="/">dvz</a><b>OV-monitor</b></header>
<main>
  <div class="kaart">
    <div class="code">FOUT {{ code }}</div>
    <h1>{{ titel }}</h1>
    <p>{{ uitleg }}</p>
    <div class="knoppen">
      <a class="knop primair" href="/">Naar de OV-monitor</a>
      <button class="knop stil" type="button" onclick="history.back()">Terug</button>
    </div>
  </div>
</main>
</body>
</html>
